spring.application.name=biblioteca-api

# Puerto que consume la app de Flutter
server.port=8080

# Acepta peticiones desde otros dispositivos de la red (celular fisico)
server.address=0.0.0.0

# ===== Base de datos por defecto: H2 en memoria =====
# No hay que instalar nada. Los datos se reinician cada vez que se levanta la API.
spring.datasource.url=jdbc:h2:mem:biblioteca
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:biblioteca)
spring.h2.console.enabled=true

# ===== Opcional: MySQL =====
# 1) Creen la base:  CREATE DATABASE biblioteca;
# 2) Comenten las 3 lineas spring.datasource de H2 de arriba
# 3) Descomenten estas y pongan su usuario y contrasena
